[build-system]
requires = ["setuptools>=66.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "listenscope"
version = "0.1.0"
description = "Offline, local-first Windows music analysis and stem separation assistant (resource-guarded for RTX 5060 Ti 8GB VRAM + 16GB RAM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "psutil>=5.9.0",
    "nvidia-ml-py>=12.0.0",
]

[project.optional-dependencies]
windows = [
    "proc-tap>=1.1.1",
    "pycaw>=20240210",
    "comtypes>=1.4.0",
    "PyAudioWPatch>=0.2.12.6",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["core*", "audio*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
