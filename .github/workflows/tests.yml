name: tests

# Linux offscreen regression only. Windows audio, GPU and packaged-exe checks stay manual
# (see docs/DEVELOPMENT.md). This workflow never builds or publishes artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install Qt/PortAudio runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - name: Install core dependencies
        run: python -m pip install -r requirements-core.txt pytest
      - name: Run pytest
        run: python -m pytest -v -m "not perf" --tb=short -o faulthandler_timeout=60

  pytest-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:\Windows\Fonts
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-windows.txt
      - name: Install Windows core dependencies
        run: python -m pip install -r requirements-windows.txt pytest
      - name: Run Windows offscreen pytest
        run: python -m pytest -v -m "not perf" --tb=short -o faulthandler_timeout=180
      - name: Capture Windows offscreen UI screenshots
        if: always()
        run: python scripts/make_screenshots.py --out-dir artifacts/p2e_win_screens --prefix p2er_after_ --suffix _win
      - name: Upload Windows offscreen screenshots artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p2e-windows-screenshots
          path: artifacts/p2e_win_screens/*.png
          if-no-files-found: error

  perf:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-windows.txt
      - name: Install Qt/PortAudio runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - name: Install core dependencies (Linux)
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements-core.txt pytest
      - name: Install Windows core dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m pip install -r requirements-windows.txt pytest
      - name: Run perf tests and write job summary
        shell: bash
        run: |
          set +e
          python -m pytest -v -m perf -s --tb=short | tee perf_output.txt
          rc=${PIPESTATUS[0]}
          median=$(grep -Eo 'PERF_MEDIAN_MS=[0-9.]+' perf_output.txt | tail -n 1 | cut -d= -f2)
          [ -z "$median" ] && median="N/A"
          {
            echo "### Perf Summary (${{ matrix.os }})"
            echo "| Runner | Median (\`analyze_latest_once\`) | Threshold | Exit Code |"
            echo "|---|---|---|---|"
            echo "| \`${{ matrix.os }}\` | **${median} ms** | <= 5.0 ms | \`${rc}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
