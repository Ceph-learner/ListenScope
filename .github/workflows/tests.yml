name: tests

# Linux offscreen regression only. Windows audio, GPU and packaged-exe checks stay manual
# (see docs/DEVELOPMENT.md). This workflow never builds or publishes artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: Install Qt/PortAudio runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - name: Install core dependencies
        run: python -m pip install -r requirements-core.txt pytest
      - name: Run pytest
        run: python -m pytest -q --tb=short
