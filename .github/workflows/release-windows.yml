name: release-windows

# Automated Windows x64 Core release build:
#   - Installs Windows Core dependencies + PyInstaller + pytest (no PyTorch / CUDA / TensorFlow bundled)
#   - Runs Windows offscreen pytest regression suite
#   - Packages `dist\ListenScopeCore\ListenScope.exe` via packaging\listenscope_core.spec
#   - Smoke-tests a relocated copy of the frozen exe (`--simulate --headless-smoke`) without polluting dist/
#   - Creates portable archive `ListenScope-Core-Windows-x64-Portable.zip`
#   - Compiles Inno Setup 6 installer `ListenScope-Setup-Windows-x64.exe`
#   - Generates `SHA256SUMS.txt`, uploads workflow artifacts, and publishes GitHub Release on `v*` tags (unless dry_run=true)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional version tag override when running manually (e.g. v1.1.0)"
        required: false
        default: ""
      dry_run:
        description: "Dry-run mode: build installer, portable ZIP, and SHA256SUMS.txt as workflow artifacts without creating a Release or tag"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-core:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: C:\Windows\Fonts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: pip
          cache-dependency-path: |
            requirements-core.txt
            requirements-windows.txt

      - name: Resolve application version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          $pyVersion = python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text('utf-8'))['project']['version'])"
          $pyVersion = $pyVersion.Trim()
          if (-not $pyVersion) {
            throw "Failed to read project.version from pyproject.toml"
          }
          $tagName = "$env:REF_NAME".Trim()
          if ($env:EVENT_NAME -eq "workflow_dispatch" -and "$env:RELEASE_TAG_INPUT".Trim()) {
            $tagName = "$env:RELEASE_TAG_INPUT".Trim()
          }
          if ($tagName -match '^v(\d+\.\d+\.\d+(?:[-+].+)?)$') {
            $tagVersion = $Matches[1]
            if ($env:REF_TYPE -eq "tag" -and $tagVersion -ne $pyVersion) {
              throw "Tag '$tagName' ($tagVersion) does not match pyproject.toml version ($pyVersion)"
            }
          }
          if ($pyVersion -match '^(\d+\.\d+\.\d+)-rc\.(\d+)$') {
            $numericVersion = "$($Matches[1]).$($Matches[2])"
          } elseif ($pyVersion -match '^(\d+\.\d+\.\d+)$') {
            $numericVersion = "$($Matches[1]).100"
          } elseif ($pyVersion -match '^(\d+\.\d+\.\d+)-') {
            $numericVersion = "$($Matches[1]).0"
          } else {
            throw "Cannot derive numeric Windows version from '$pyVersion'"
          }
          "APP_VERSION=$pyVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_NUMERIC_VERSION=$numericVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$pyVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $shortSha = (git rev-parse --short=7 HEAD).Trim()
          "LISTENSCOPE_GIT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved APP_VERSION=$pyVersion NUMERIC=$numericVersion RELEASE_TAG=v$pyVersion GIT_SHA=$shortSha DRY_RUN=$($env:DRY_RUN_INPUT)"

      - name: Install Windows Core dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt pyinstaller pytest

      - name: Run Windows offscreen pytest suite
        run: |
          python -m pytest -v -m "not perf" --tb=short -o faulthandler_timeout=180

      - name: Build Core executable via PyInstaller
        run: |
          @"
          BASE_VERSION = "$env:APP_VERSION"
          BUILD_VERSION = "$env:APP_VERSION"
          GIT_SHA = "$env:LISTENSCOPE_GIT_SHA"
          "@ | Set-Content -Path "core\_build_info.py" -Encoding utf8
          python -m PyInstaller packaging\listenscope_core.spec --noconfirm --clean
          $exe = Join-Path $PWD "dist\ListenScopeCore\ListenScope.exe"
          if (-not (Test-Path $exe)) {
            throw "PyInstaller finished without producing $exe"
          }
          $assetBase = if (Test-Path "dist\ListenScopeCore\_internal\ui\assets") {
            "dist\ListenScopeCore\_internal\ui\assets"
          } else {
            "dist\ListenScopeCore\ui\assets"
          }
          foreach ($asset in @(
            "listenscope.ico",
            "listenscope.svg",
            "acid_check_dark.svg",
            "acid_check_light.svg",
            "acid_chevron_down_dark.svg",
            "acid_chevron_down_light.svg",
            "acid_chevron_up_dark.svg",
            "acid_chevron_up_light.svg"
          )) {
            $p = Join-Path $assetBase $asset
            if (-not (Test-Path $p)) {
              throw "Missing bundled UI asset in frozen package: $p"
            }
          }

      - name: Smoke test relocated frozen Core executable
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "listenscope-smoke\ListenScopeCore"
          if (Test-Path $smokeRoot) {
            Remove-Item -Recurse -Force $smokeRoot
          }
          Copy-Item -Path "dist\ListenScopeCore" -Destination $smokeRoot -Recurse -Force
          $biPath = if (Test-Path (Join-Path $smokeRoot "_internal\core\_build_info.py")) {
            Join-Path $smokeRoot "_internal\core\_build_info.py"
          } else {
            Join-Path $smokeRoot "core\_build_info.py"
          }
          if (-not (Test-Path $biPath)) {
            throw "Missing packaged _build_info.py at $biPath"
          }
          $biText = Get-Content -Path $biPath -Raw
          if ($biText -notmatch ('BUILD_VERSION\s*=\s*"' + [regex]::Escape($env:APP_VERSION) + '"')) {
            throw "Unexpected BUILD_VERSION in packaged _build_info.py:`n$biText"
          }
          $smokeExe = Join-Path $smokeRoot "ListenScope.exe"
          $proc = Start-Process -FilePath $smokeExe -ArgumentList @("--simulate", "--headless-smoke") -WorkingDirectory $smokeRoot -PassThru
          if (-not $proc.WaitForExit(45000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Frozen ListenScope.exe --simulate --headless-smoke timed out after 45s"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Frozen ListenScope.exe smoke test exited with code $($proc.ExitCode)"
          }
          $logFile = Get-ChildItem -Path $smokeRoot -Recurse -Filter "listenscope.log" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $logFile) {
            throw "Expected listenscope.log under $smokeRoot after frozen smoke test"
          }
          $logText = Get-Content -Path $logFile.FullName -Raw
          $expectedLine = "ListenScope startup version=$($env:APP_VERSION) base=$($env:APP_VERSION)"
          if ($logText -notmatch [regex]::Escape($expectedLine)) {
            throw "Frozen exe did not report expected version '$expectedLine' in listenscope.log:`n$logText"
          }
          if ($logText -match "ListenScope startup version=[^\r\n]*(-dev|\+)") {
            throw "Frozen exe reported unexpected -dev/+sha version in listenscope.log:`n$logText"
          }
          Write-Host "Relocated frozen smoke test passed (ExitCode=0, version=$($env:APP_VERSION))"

      - name: Stage license and notice files into dist\ListenScopeCore
        run: |
          Copy-Item -Path "LICENSE", "THIRD_PARTY_NOTICES.md", "ACKNOWLEDGMENTS.md" -Destination "dist\ListenScopeCore" -Force
          Copy-Item -Path "licenses" -Destination "dist\ListenScopeCore\licenses" -Recurse -Force
          foreach ($req in @("LICENSE", "THIRD_PARTY_NOTICES.md", "ACKNOWLEDGMENTS.md", "licenses\LGPL-3.0.txt")) {
            $p = Join-Path "dist\ListenScopeCore" $req
            if (-not (Test-Path $p)) {
              throw "Missing staged license file in dist\ListenScopeCore: $p"
            }
          }

      - name: Package Portable Core ZIP
        run: |
          New-Item -ItemType Directory -Force -Path "dist\release" | Out-Null
          $zipPath = "dist\release\ListenScope-Core-Windows-x64-Portable.zip"
          if (Test-Path $zipPath) {
            Remove-Item -Force $zipPath
          }
          Compress-Archive -Path "dist\ListenScopeCore\*" -DestinationPath $zipPath -CompressionLevel Optimal
          if (-not (Test-Path $zipPath)) {
            throw "Failed to create $zipPath"
          }

      - name: Ensure Inno Setup 6 and compile Setup installer
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc -or -not (Test-Path $iscc)) {
            throw "Inno Setup 6 compiler (ISCC.exe) not found after choco install"
          }
          & $iscc "/DMyAppVersion=$($env:APP_VERSION)" "/DMyAppNumericVersion=$($env:APP_NUMERIC_VERSION)" "scripts\installer.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC.exe failed with exit code $LASTEXITCODE"
          }
          $setupSrc = "dist\installer\ListenScope-Setup-Windows-x64.exe"
          if (-not (Test-Path $setupSrc)) {
            throw "Expected installer missing: $setupSrc"
          }
          Copy-Item -Path $setupSrc -Destination "dist\release\ListenScope-Setup-Windows-x64.exe" -Force

      - name: Generate SHA256SUMS.txt
        run: |
          $files = @(
            "ListenScope-Setup-Windows-x64.exe",
            "ListenScope-Core-Windows-x64-Portable.zip"
          )
          $lines = foreach ($name in $files) {
            $full = Join-Path "dist\release" $name
            $hash = (Get-FileHash -Path $full -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name"
          }
          $lines | Set-Content -Path "dist\release\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\release\SHA256SUMS.txt"

      - name: Upload Release build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: listenscope-windows-core-${{ env.APP_VERSION }}
          path: |
            dist/release/ListenScope-Setup-Windows-x64.exe
            dist/release/ListenScope-Core-Windows-x64-Portable.zip
            dist/release/SHA256SUMS.txt
          retention-days: 14

      - name: Write dry-run artifact summary
        if: inputs.dry_run == true || !startsWith(github.ref, 'refs/tags/v')
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          $artifactName = "listenscope-windows-core-$($env:APP_VERSION)"
          $sums = (Get-Content -Path "dist\release\SHA256SUMS.txt" -Raw).TrimEnd()
          @(
            "### Windows Core Dry-Run Artifact Summary",
            "",
            "- **Event**: ``$($env:EVENT_NAME)`` (``dry_run=$($env:DRY_RUN_INPUT)``)",
            "- **Artifact**: ``$artifactName``",
            "- **App Version**: ``$($env:APP_VERSION)``",
            "- **Release Published**: ``false``",
            "",
            "#### ``SHA256SUMS.txt``",
            '```text',
            $sums,
            '```'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = "$env:REF_NAME"
          $isPrerelease = $tag.Contains("-")
          $notesLines = @(
            "### 安装包说明 (Windows x64 Core)",
            "- **``ListenScope-Setup-Windows-x64.exe``**：Inno Setup 6 单文件安装版（免管理员，默认保留升级后 ``exports\``）。",
            "- **``ListenScope-Core-Windows-x64-Portable.zip``**：解压即用的绿色便携版（内含 ``ListenScope.exe``）。",
            "- **图形化一键配置**：主程序仅打包轻量 Core（无需显卡即可实时分析与 A/B 练习）；如需 GPU AI 分轨或 Basic Pitch 转 MIDI，可在软件内 **``CONFIG // 设置 → AI 与 MIDI 环境``** 一键扫描本机 PyTorch 或自动配置。",
            "",
            "### 完整性校验（SHA256）",
            "发行包暂未进行商业代码签名，首次运行可能弹出 Windows SmartScreen 提示。请在 PowerShell 中校验 SHA256 哈希并与附件 ``SHA256SUMS.txt`` 比对一致后，点击 **「更多信息 → 仍要运行」**：",
            '```powershell',
            "Get-FileHash ListenScope-Setup-Windows-x64.exe -Algorithm SHA256",
            "Get-FileHash ListenScope-Core-Windows-x64-Portable.zip -Algorithm SHA256",
            "Get-Content SHA256SUMS.txt",
            '```',
            "",
            "### 硬件兼容性备注",
            "- 目前已在 **Windows 11 + NVIDIA RTX 5060 Ti (8 GB VRAM) + 16 GB RAM** 环境实测通过；其余显卡与硬件配置尚未全面测试，如遇问题欢迎在 Issues 反馈。"
          )
          $extraArgs = @()
          if ($isPrerelease) {
            $notesLines = @(
              "**测试版，仅用于验证升级流程**（Pre-release）：本版本仅用于验证应用内在线升级、安装版覆盖与便携版回滚流程，正式使用请等待正式版。",
              ""
            ) + $notesLines
            $extraArgs += "--prerelease"
          }
          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notesLines | Set-Content -Path $notesFile -Encoding utf8
          gh release create $tag `
            "dist\release\ListenScope-Setup-Windows-x64.exe" `
            "dist\release\ListenScope-Core-Windows-x64-Portable.zip" `
            "dist\release\SHA256SUMS.txt" `
            --title "ListenScope $tag (Windows x64 Core)" `
            --generate-notes `
            --notes-file $notesFile `
            @extraArgs
