version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      pip-dependencies:
        patterns:
          - "*"
    ignore:
      # AI & MIDI runtimes are pinned/constrained by cu128 and TensorFlow compatibility
      - dependency-name: "torch*"
      - dependency-name: "torchaudio*"
      - dependency-name: "onnxruntime*"
      - dependency-name: "audio-separator"
      - dependency-name: "demucs"
      - dependency-name: "basic-pitch"
      - dependency-name: "tensorflow*"
      # PySide6 is intentionally pinned <6.10 due to 6.12 Signal.emit regression
      - dependency-name: "PySide6*"
      # Defer major upgrades for numpy 2.x (tracked in #33), winrt >=4, and setuptools >=81 (CI incompatible)
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "winrt-*"
        versions: [">=4"]
      - dependency-name: "setuptools"
        versions: [">=81"]
